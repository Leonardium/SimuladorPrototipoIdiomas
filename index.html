<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de Comprensión Lectora · Idiomas UVM</title>
<style>
  /* ========== UVM tokens ========== */
  :root{
    --rojo:#C8102E;
    --rojo-oscuro:#9E0C24;
    --negro:#1A1A1A;
    --blanco:#FFFFFF;
    --gris:#F2F2F2;
    --gris-2:#DCDCDC;
    --gris-texto:#5C5C5C;
    --verde:#1E7F4F;
    --verde-bg:#E4F3EA;
    --rojo-bg:#FBE7EA;
    --ambar:#B86E00;
    --ambar-bg:#FFF3DF;
    --font: "Liberation Sans", Arial, Helvetica, sans-serif;
    --radius:6px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--gris);
    color:var(--negro);
    font-size:16px;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:var(--rojo)}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  button:focus-visible, a:focus-visible, input:focus-visible, label:focus-within{
    outline:3px solid var(--rojo); outline-offset:2px;
  }
  .oculto{display:none !important}

  /* ========== Top bar ========== */
  .barra{
    background:var(--negro);
    color:var(--blanco);
    height:56px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px;
    border-bottom:4px solid var(--rojo);
    position:sticky; top:0; z-index:20;
  }
  .barra .marca{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
  .barra .marca .cuadro{
    width:30px;height:30px;background:var(--rojo);
    display:grid;place-items:center;font-weight:900;font-size:13px;border-radius:3px;
  }
  .barra .marca small{font-weight:400;color:#BDBDBD;margin-left:2px}
  .barra .usuario{display:flex;align-items:center;gap:12px;font-size:14px}
  .barra .usuario .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--rojo);
    display:grid;place-items:center;font-weight:700;
  }
  .barra .btn-texto{
    background:transparent;border:1px solid #555;color:var(--blanco);
    padding:6px 12px;border-radius:var(--radius);font-size:13px;
  }
  .barra .btn-texto:hover{border-color:var(--blanco)}

  /* ========== Buttons ========== */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:var(--radius);border:2px solid transparent;
    font-weight:700;text-decoration:none;
  }
  .btn-rojo{background:var(--rojo);color:var(--blanco)}
  .btn-rojo:hover{background:var(--rojo-oscuro)}
  .btn-rojo:disabled{background:#C9C9C9;cursor:not-allowed}
  .btn-borde{background:var(--blanco);color:var(--negro);border-color:var(--negro)}
  .btn-borde:hover{background:var(--negro);color:var(--blanco)}
  .btn-suave{background:var(--gris);color:var(--negro)}
  .btn-suave:hover{background:var(--gris-2)}

  /* ========== Login ========== */
  .login-fondo{
    min-height:100vh;
    display:grid;place-items:center;
    padding:24px;
    background:
      linear-gradient(135deg, var(--negro) 0 52%, var(--rojo) 52% 53%, var(--gris) 53% 100%);
  }
  .login-caja{
    background:var(--blanco);
    width:100%;max-width:440px;
    padding:40px 40px 32px;
    border-radius:var(--radius);
    box-shadow:0 12px 40px rgba(0,0,0,.25);
    border-top:6px solid var(--rojo);
  }
  .login-caja h1{margin:0 0 4px;font-size:26px;line-height:1.2}
  .login-caja .sub{margin:0 0 28px;color:var(--gris-texto);font-size:15px}
  .btn-google{
    width:100%;display:flex;align-items:center;justify-content:center;gap:12px;
    background:var(--blanco);border:2px solid var(--gris-2);color:var(--negro);
    padding:12px 16px;border-radius:var(--radius);font-weight:700;font-size:15px;
  }
  .btn-google:hover{border-color:var(--negro);background:var(--gris)}
  .btn-google svg{width:20px;height:20px}
  .login-nota{
    margin-top:24px;padding:12px 14px;background:var(--ambar-bg);color:var(--ambar);
    border-radius:var(--radius);font-size:13px;line-height:1.45;
  }
  .login-pie{margin-top:20px;font-size:12px;color:var(--gris-texto)}

  /* account chooser modal */
  .modal-fondo{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:grid;place-items:center;z-index:50;padding:16px;
  }
  .modal{
    background:var(--blanco);width:100%;max-width:420px;
    border-radius:8px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .modal h2{margin:0 0 4px;font-size:20px}
  .modal p{margin:0 0 20px;color:var(--gris-texto);font-size:14px}
  .cuenta{
    display:flex;align-items:center;gap:14px;
    width:100%;text-align:left;
    padding:12px;border:1px solid var(--gris-2);border-radius:var(--radius);
    background:var(--blanco);margin-bottom:10px;
  }
  .cuenta:hover{background:var(--gris);border-color:var(--negro)}
  .cuenta .av{
    width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
    color:var(--blanco);font-weight:700;flex-shrink:0;
  }
  .cuenta .info{line-height:1.3}
  .cuenta .info b{display:block}
  .cuenta .info span{font-size:13px;color:var(--gris-texto)}
  .cuenta .rol{
    margin-left:auto;font-size:11px;font-weight:700;
    padding:3px 8px;border-radius:99px;background:var(--gris);color:var(--gris-texto);
  }

  /* ========== Layout ========== */
  .contenedor{max-width:1120px;margin:0 auto;padding:32px 24px 64px}
  .encabezado{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:28px;
    padding-bottom:16px;border-bottom:2px solid var(--negro);
  }
  .encabezado h1{margin:0;font-size:30px;line-height:1.15}
  .encabezado p{margin:6px 0 0;color:var(--gris-texto)}

  /* ========== Dashboard ========== */
  .seccion{
    background:var(--blanco);
    border-radius:var(--radius);
    margin-bottom:22px;
    overflow:hidden;
    border:1px solid var(--gris-2);
  }
  .seccion-cab{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:16px 22px;
    background:var(--negro);color:var(--blanco);
    border-left:8px solid var(--rojo);
  }
  .seccion-cab h2{margin:0;font-size:18px}
  .seccion-cab .meta{font-size:13px;color:#C8C8C8}
  .lecturas{padding:8px 0}
  .lectura{
    display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;
    padding:16px 22px;
    border-bottom:1px solid var(--gris);
  }
  .lectura:last-child{border-bottom:0}
  .lectura h3{margin:0 0 3px;font-size:17px}
  .lectura .datos{font-size:13px;color:var(--gris-texto);display:flex;gap:14px;flex-wrap:wrap}
  .lectura .datos span::before{
    content:"";display:inline-block;width:6px;height:6px;
    background:var(--rojo);border-radius:50%;margin-right:6px;vertical-align:middle;
  }
  .lectura .resultado{
    font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px;
  }
  .resultado.ok{background:var(--verde-bg);color:var(--verde)}
  .resultado.mal{background:var(--rojo-bg);color:var(--rojo)}

  /* ========== Exam ========== */
  .examen{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:28px;align-items:start;
  }
  .panel-lectura{
    background:var(--blanco);border-radius:var(--radius);
    border:1px solid var(--gris-2);
    padding:28px 32px;
    position:sticky;top:76px;
    max-height:calc(100vh - 100px);overflow:auto;
  }
  .panel-lectura h2{margin:0 0 4px;font-size:22px;line-height:1.2}
  .panel-lectura .fuente{font-size:12px;color:var(--gris-texto);margin-bottom:18px}
  .panel-lectura p{margin:0 0 14px;font-size:15.5px;line-height:1.65;max-width:62ch}
  .panel-lectura p .parr{
    color:var(--rojo);font-weight:700;font-size:12px;margin-right:6px;
  }
  .panel-preguntas{display:flex;flex-direction:column;gap:14px}
  .barra-progreso{
    background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;
    position:sticky;top:76px;z-index:5;
  }
  .barra-progreso .pista{
    flex:1;height:8px;background:var(--gris);border-radius:99px;overflow:hidden;
  }
  .barra-progreso .pista i{
    display:block;height:100%;background:var(--rojo);width:0;
    transition:width .25s ease;
  }
  .barra-progreso .num{font-size:13px;font-weight:700;white-space:nowrap}
  .barra-progreso .reloj{
    font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
    padding:4px 10px;border-radius:var(--radius);background:var(--negro);color:var(--blanco);
  }
  .barra-progreso .reloj.alerta{background:var(--rojo)}

  .pregunta{
    background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);
    padding:20px 22px;
  }
  .pregunta.sin-responder{border-left:4px solid var(--ambar)}
  .pregunta .enunciado{
    display:flex;gap:12px;margin:0 0 14px;font-weight:700;line-height:1.4;
  }
  .pregunta .enunciado .n{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    background:var(--negro);color:var(--blanco);
    display:grid;place-items:center;font-size:13px;
  }
  .opcion{
    display:flex;align-items:flex-start;gap:12px;
    padding:11px 12px;border-radius:var(--radius);
    border:1px solid var(--gris-2);margin-bottom:8px;cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  .opcion:hover{background:var(--gris)}
  .opcion input{margin-top:3px;accent-color:var(--rojo)}
  .opcion .letra{font-weight:700;width:20px;flex-shrink:0}
  .opcion.elegida{border-color:var(--rojo);background:var(--rojo-bg)}
  /* review states */
  .opcion.correcta{border-color:var(--verde);background:var(--verde-bg)}
  .opcion.incorrecta{border-color:var(--rojo);background:var(--rojo-bg)}
  .opcion.correcta .letra::after{content:" ✓";color:var(--verde)}
  .opcion.incorrecta .letra::after{content:" ✕";color:var(--rojo)}
  .justificacion{
    margin-top:10px;padding:12px 14px;font-size:14px;
    background:var(--gris);border-radius:var(--radius);
    border-left:4px solid var(--negro);
  }
  .justificacion b{display:block;margin-bottom:2px;font-size:12px;color:var(--gris-texto)}

  .acciones{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
  .aviso{
    background:var(--ambar-bg);color:var(--ambar);padding:12px 16px;
    border-radius:var(--radius);font-size:14px;
  }

  /* ========== Results ========== */
  .resumen{
    display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;
    background:var(--negro);color:var(--blanco);
    padding:32px;border-radius:var(--radius);
    border-left:10px solid var(--rojo);margin-bottom:28px;
  }
  .resumen .puntaje{font-size:72px;font-weight:900;line-height:1;letter-spacing:-2px}
  .resumen .puntaje small{font-size:24px;font-weight:400;color:#BDBDBD;margin-left:4px}
  .resumen h2{margin:0 0 6px;font-size:22px}
  .resumen p{margin:0;color:#D0D0D0}
  .habilidades{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;
    margin-bottom:28px;
  }
  .hab{
    background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);
    padding:14px 16px;
  }
  .hab .nombre{font-size:13px;color:var(--gris-texto);margin-bottom:6px;line-height:1.3}
  .hab .frac{font-size:22px;font-weight:700}
  .hab .frac small{font-size:13px;font-weight:400;color:var(--gris-texto)}
  .hab .mini{height:5px;background:var(--gris);border-radius:99px;margin-top:8px;overflow:hidden}
  .hab .mini i{display:block;height:100%;background:var(--rojo)}
  .hab.perfecta .mini i{background:var(--verde)}

  /* ========== Teacher view ========== */
  .tabla{width:100%;border-collapse:collapse;background:var(--blanco);
    border:1px solid var(--gris-2);border-radius:var(--radius);overflow:hidden}
  .tabla th,.tabla td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--gris)}
  .tabla th{background:var(--negro);color:var(--blanco);font-size:13px;font-weight:700}
  .tabla tr:last-child td{border-bottom:0}
  .tabla td.num{text-align:right;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .barra{padding:0 14px}
    .barra .marca small, .barra .usuario span{display:none}
    .barra .btn-texto{padding:6px 10px;white-space:nowrap}
    .panel-lectura > h2{display:none}
    .examen{grid-template-columns:1fr}
    .panel-lectura{position:static;max-height:none}
    .barra-progreso{top:56px}
    .resumen{grid-template-columns:1fr;text-align:center}
    .contenedor{padding:20px 16px 48px}
    .login-caja{padding:28px 24px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }

  /* ========== Añadidos v2 (Firebase) ========== */
  .cargando{min-height:100vh;display:grid;place-items:center;color:var(--gris-texto);font-size:15px}
  .spinner{width:34px;height:34px;border:4px solid var(--gris-2);border-top-color:var(--rojo);
    border-radius:50%;animation:gira 0.8s linear infinite;margin:0 auto 14px}
  @keyframes gira{to{transform:rotate(360deg)}}
  .login-error{margin-top:16px;padding:12px 14px;background:var(--rojo-bg);color:var(--rojo);
    border-radius:var(--radius);font-size:14px}

  .barra nav{display:flex;gap:4px;margin-left:24px}
  .barra nav button{background:transparent;border:0;color:#CFCFCF;padding:8px 12px;border-radius:var(--radius);font-size:14px;font-weight:700}
  .barra nav button:hover{color:var(--blanco);background:#2A2A2A}
  .barra nav button.activo{color:var(--blanco);background:var(--rojo)}
  .barra .izq{display:flex;align-items:center}
  .etiqueta-rol{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#333;color:#DDD;text-transform:uppercase;letter-spacing:.4px}

  .tarjeta{background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px}
  .tarjeta h2{margin:0 0 14px;font-size:18px}
  .campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .campo label,.campo .lbl{font-size:13px;font-weight:700}
  .campo small{color:var(--gris-texto);font-size:12px}
  input[type=text],input[type=email],input[type=number],select,textarea{
    font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid #BDBDBD;border-radius:var(--radius);
    background:var(--blanco);color:var(--negro);width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--rojo);outline-offset:0;border-color:var(--rojo)}
  textarea{resize:vertical;line-height:1.5}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
  .check{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px}
  .check input{accent-color:var(--rojo);width:18px;height:18px}
  .fila-acciones{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn-chico{padding:6px 12px;font-size:13px}
  .btn-peligro{background:var(--blanco);color:var(--rojo);border-color:var(--rojo)}
  .btn-peligro:hover{background:var(--rojo);color:var(--blanco)}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
  .chip.verde{background:var(--verde-bg);color:var(--verde)}
  .chip.gris{background:var(--gris);color:var(--gris-texto)}
  .chip.ambar{background:var(--ambar-bg);color:var(--ambar)}
  .chip.rojo{background:var(--rojo-bg);color:var(--rojo)}

  .tabla-envoltura{overflow-x:auto;border-radius:var(--radius)}
  .tabla td .sub{display:block;font-size:12px;color:var(--gris-texto)}
  .tabla td.acc{white-space:nowrap;text-align:right}
  .tabla tr.clic:hover td{background:#FAFAFA}
  .vacio{padding:28px;text-align:center;color:var(--gris-texto);background:var(--blanco);border:1px dashed #BDBDBD;border-radius:var(--radius)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
  .stat{background:var(--blanco);border:1px solid var(--gris-2);border-left:5px solid var(--rojo);border-radius:var(--radius);padding:14px 16px}
  .stat b{display:block;font-size:26px;line-height:1.1}
  .stat span{font-size:13px;color:var(--gris-texto)}

  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .item{background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);padding:8px 10px;font-size:13px}
  .item b{font-size:16px}
  .item .mini{height:5px;background:var(--gris);border-radius:99px;margin-top:6px;overflow:hidden}
  .item .mini i{display:block;height:100%;background:var(--verde)}
  .item.bajo .mini i{background:var(--rojo)}

  /* Editor de preguntas */
  .q-editor{border:1px solid var(--gris-2);border-left:4px solid var(--negro);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px;background:var(--blanco)}
  .q-editor .q-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .q-editor .q-cab b{font-size:15px}
  .op-fila{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
  .op-fila input[type=radio]{accent-color:var(--verde);width:18px;height:18px}
  .op-fila .letra{font-weight:700;width:18px}
  .op-fila.es-correcta input[type=text]{border-color:var(--verde);background:var(--verde-bg)}
  .btn-icono{background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);width:34px;height:34px;display:grid;place-items:center;color:var(--gris-texto);font-size:16px;line-height:1}
  .btn-icono:hover{border-color:var(--negro);color:var(--negro)}
  .btn-icono:disabled{opacity:.35;cursor:not-allowed}
  .formato{background:var(--gris);border-radius:var(--radius);padding:12px 14px;font-family:"Liberation Mono",Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;line-height:1.45;margin:0 0 12px}
  .pegajoso{position:sticky;bottom:0;background:var(--gris);padding:14px 0;border-top:1px solid var(--gris-2);z-index:4}

  .lista-simple{list-style:none;margin:0 0 12px;padding:0}
  .lista-simple li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--blanco);border:1px solid var(--gris-2);border-radius:var(--radius);margin-bottom:6px}
  .en-linea{display:flex;gap:8px;flex-wrap:wrap}
  .en-linea > *{flex:1;min-width:160px}
  .en-linea > .btn{flex:0 0 auto}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--negro);color:var(--blanco);
    padding:10px 18px;border-radius:var(--radius);font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:4px solid var(--rojo)}
  .encabezado .btn-suave{background:var(--blanco);border-color:var(--gris-2)}
  .encabezado .btn-suave:hover{border-color:var(--negro)}
  .examen.sin-texto{grid-template-columns:minmax(0,760px);justify-content:center}
  .instrucciones{background:var(--blanco);border:1px solid var(--gris-2);border-left:5px solid var(--negro);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;font-size:15px}
  .instrucciones b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gris-texto);margin-bottom:2px}
  .pregunta .enunciado > span:last-child{white-space:pre-line}
  #usuario-nombre{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barra nav button,.barra .btn-texto,.btn-panel{white-space:nowrap}
  @media (max-width:1400px){ .barra .marca small{display:none} }
  .barra-global{position:sticky;top:56px;z-index:6;margin-top:4px;box-shadow:0 -12px 0 var(--gris),0 4px 12px rgba(0,0,0,.06)}
  .bloque-seccion{margin-top:28px}
  .bloque-cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 18px;margin-bottom:14px;background:var(--negro);color:var(--blanco);border-left:8px solid var(--rojo);border-radius:var(--radius)}
  .bloque-cab h2{margin:0;font-size:19px}
  .bloque-num{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#C8C8C8}
  .bloque-meta{margin-left:auto;font-size:13px;color:#C8C8C8}
  .bloque-seccion .panel-lectura{top:130px;max-height:calc(100vh - 150px)}
  .btn-panel{background:var(--rojo);border:0;color:var(--blanco);padding:6px 12px;border-radius:var(--radius);font-size:13px;font-weight:700}
  .guardado{font-size:12px;color:var(--gris-texto);white-space:nowrap}
  .modal .acciones{margin-top:18px}
  .modal .cuerpo{font-size:15px;color:var(--negro);margin:0 0 4px;white-space:pre-line}

  @media (max-width:860px){
    .barra{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 14px;gap:6px}
    .barra .izq{flex-wrap:wrap}
    .barra nav{margin-left:0;overflow-x:auto;max-width:100%}
    .barra nav button{padding:6px 10px;white-space:nowrap}
    .op-fila{grid-template-columns:auto auto 1fr auto}
    .tarjeta{padding:18px 16px}
  }
</style>
</head>
<body>

<!-- Pantalla de carga mientras Firebase revisa la sesión -->
<div id="vista-cargando" class="cargando">
  <div><div class="spinner"></div>Cargando…</div>
</div>

<!-- ============================ LOGIN ============================ -->
<div id="vista-login" class="login-fondo oculto">
  <div class="login-caja">
    <h1>Simulador de comprensión lectora</h1>
    <p class="sub">Academias de Idiomas · UVM Campus Mérida</p>

    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.5 13.3l7.9 6.1C12.3 13.6 17.7 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.2z"/>
        <path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.5 10.7l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.3 0 11.7-2.1 15.6-5.7l-7.7-6c-2.1 1.4-4.8 2.3-7.9 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <div id="login-error" class="login-error oculto"></div>
    <div class="login-pie">Usa tu cuenta institucional. · <span id="login-autor"></span></div>
  </div>
</div>

<!-- ============================ APP ============================ -->
<div id="app" class="oculto">
  <header class="barra">
    <div class="izq">
      <div class="marca">
        <div class="cuadro">UVM</div>
        <div>Simulador Idiomas <small>· Comprensión lectora</small></div>
      </div>
      <nav id="nav" class="oculto"></nav>
    </div>
    <div class="usuario">
      <span class="etiqueta-rol" id="etiqueta-rol"></span>
      <div class="avatar" id="avatar-ini">A</div>
      <span id="usuario-nombre"></span>
      <button class="btn-panel oculto" id="btn-panel">Volver al panel</button>
      <button class="btn-texto" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>
  <main class="contenedor" id="main"></main>
</div>

<!-- Modal genérico (confirmaciones y avisos) -->
<div id="modal" class="modal-fondo oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal">
    <h2 id="modal-titulo"></h2>
    <p class="cuerpo" id="modal-cuerpo"></p>
    <div class="acciones" id="modal-acciones"></div>
  </div>
</div>

<div id="toast" class="toast oculto" role="status" aria-live="polite"></div>

<script type="module" src="app.js?v=9"></script>
</body>
</html>
